<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" font-family="system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="Kanakku architecture: documents, extraction, deterministic rules, clinical checks, adversarial review, final findings" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker>
    <style>
      .box{fill:#fff;stroke:#0f3d2e;stroke-width:1.5}
      .code{fill:#e8f1ec;stroke:#0f3d2e;stroke-width:1.5}
      .ai{fill:#fdf3e1;stroke:#b7791f;stroke-width:1.5}
      .t{font-size:14px;fill:#111827;font-weight:600}
      .s{font-size:11.5px;fill:#374151}
      .l{stroke:#475569;stroke-width:1.5;fill:none}
    </style>
  </defs>
  <text x="480" y="26" text-anchor="middle" class="t" style="font-size:16px">Kanakku pipeline (green = code, amber = AI, white = input/output)</text>
  <rect x="20" y="150" width="140" height="90" rx="10" class="box"/><text x="90" y="182" text-anchor="middle" class="t">Documents</text><text x="90" y="202" text-anchor="middle" class="s">Itemised bill +</text><text x="90" y="218" text-anchor="middle" class="s">discharge summary</text>
  <rect x="195" y="150" width="150" height="90" rx="10" class="ai"/><text x="270" y="176" text-anchor="middle" class="t">1. Extraction</text><text x="270" y="196" text-anchor="middle" class="s">AI copies to JSON, nulls</text><text x="270" y="212" text-anchor="middle" class="s">for unreadable; code</text><text x="270" y="228" text-anchor="middle" class="s">validates, assigns ids</text>
  <rect x="380" y="60" width="170" height="100" rx="10" class="code"/><text x="465" y="86" text-anchor="middle" class="t">2. Deterministic rules</text><text x="465" y="106" text-anchor="middle" class="s">D1 arithmetic, duplicates,</text><text x="465" y="122" text-anchor="middle" class="s">room days. D2 drug price vs</text><text x="465" y="138" text-anchor="middle" class="s">MRP / ceiling. Names matched</text><text x="465" y="152" text-anchor="middle" class="s">by AI, prices by code</text>
  <rect x="380" y="230" width="170" height="100" rx="10" class="ai"/><text x="465" y="256" text-anchor="middle" class="t">3. Clinical checks (D3)</text><text x="465" y="276" text-anchor="middle" class="s">ICU days: code. "Not in</text><text x="465" y="292" text-anchor="middle" class="s">summary" candidates: AI,</text><text x="465" y="308" text-anchor="middle" class="s">no amounts seen; code</text><text x="465" y="322" text-anchor="middle" class="s">validates and prices</text>
  <rect x="585" y="145" width="150" height="100" rx="10" class="code"/><text x="660" y="171" text-anchor="middle" class="t">Candidate findings</text><text x="660" y="191" text-anchor="middle" class="s">Structured objects;</text><text x="660" y="207" text-anchor="middle" class="s">amount_at_stake computed</text><text x="660" y="223" text-anchor="middle" class="s">by code only</text>
  <rect x="770" y="60" width="170" height="110" rx="10" class="ai"/><text x="855" y="86" text-anchor="middle" class="t">4. Adversarial review</text><text x="855" y="106" text-anchor="middle" class="s">Auditor states it,</text><text x="855" y="122" text-anchor="middle" class="s">Defender argues the</text><text x="855" y="138" text-anchor="middle" class="s">hospital's case, Judge</text><text x="855" y="154" text-anchor="middle" class="s">keeps, downgrades or drops</text>
  <rect x="770" y="215" width="170" height="115" rx="10" class="code"/><text x="855" y="241" text-anchor="middle" class="t">5. Code finalises</text><text x="855" y="261" text-anchor="middle" class="s">Enforces Judge limits (tier</text><text x="855" y="277" text-anchor="middle" class="s">only goes down), number</text><text x="855" y="293" text-anchor="middle" class="s">guard, tone lint, re-derives</text><text x="855" y="309" text-anchor="middle" class="s">amounts and de-duped totals</text>
  <rect x="585" y="300" width="150" height="90" rx="10" class="box"/><text x="660" y="326" text-anchor="middle" class="t">Final findings</text><text x="660" y="346" text-anchor="middle" class="s">Tiered, cited, with</text><text x="660" y="362" text-anchor="middle" class="s">rupee totals and an</text><text x="660" y="378" text-anchor="middle" class="s">editable letter</text>
  <path class="l" marker-end="url(#a)" d="M160 195H195"/>
  <path class="l" marker-end="url(#a)" d="M345 180L380 120"/>
  <path class="l" marker-end="url(#a)" d="M345 210L380 270"/>
  <path class="l" marker-end="url(#a)" d="M550 110L585 170"/>
  <path class="l" marker-end="url(#a)" d="M550 280L585 220"/>
  <path class="l" marker-end="url(#a)" d="M735 175L770 130"/>
  <path class="l" marker-end="url(#a)" d="M855 170V215"/>
  <path class="l" marker-end="url(#a)" d="M770 290L735 335"/>
  <text x="20" y="410" class="s">Samples without a recorded AI review use a labelled precomputed demonstration for the amber stages; no AI model runs.</text>
</svg>
